name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Gardenify ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          body: |
            ## Gardenify ${{ steps.tag.outputs.tag }}

            ### Android APK
            1. Go to [EAS Builds](https://expo.dev/accounts/luckyhegdedev/projects/gardenify/builds)
            2. Download the latest APK for this release
            3. Install on your Android device (enable "Install from unknown sources")

            ### What's Changed
            See release notes below for details.

            ### API
            - Live API: https://sasyakashi.vercel.app
            - Swagger Docs: https://sasyakashi.vercel.app/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
