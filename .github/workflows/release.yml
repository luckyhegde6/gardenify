name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK (EAS)
        id: build
        run: |
          echo "::group::Build APK"
          set +e
          BUILD_OUTPUT=$(eas build -p android --profile production --non-interactive --wait 2>&1)
          BUILD_EXIT=$?
          set -e
          echo "$BUILD_OUTPUT"
          echo "::endgroup::"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::EAS build failed (exit $BUILD_EXIT). See log above."
            exit $BUILD_EXIT
          fi
          APK_URL=$(echo "$BUILD_OUTPUT" | grep -oE 'https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.apk' | tail -1)
          if [ -z "$APK_URL" ]; then
            echo "::error::Could not find APK URL in EAS build output"
            exit 1
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
      - name: Download APK artifact
        run: |
          echo "::group::Download APK"
          curl -sL -o gardenify.apk "${{ steps.build.outputs.apk_url }}"
          ls -la gardenify.apk
          echo "APK size: $(stat --printf=%s gardenify.apk) bytes"
          echo "::endgroup::"
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gardenify-apk
          path: gardenify.apk
          retention-days: 90

  create-release:
    name: Create Release
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: gardenify-apk
          path: .
      - name: Verify APK exists
        run: |
          if [ -f gardenify.apk ]; then
            echo "APK ready: $(stat --printf=%s gardenify.apk) bytes"
            mv gardenify.apk gardenify-${{ steps.tag.outputs.tag }}.apk
          else
            echo "WARNING: APK not found"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Gardenify ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          files: |
            gardenify-${{ steps.tag.outputs.tag }}.apk
          body: |
            ## Gardenify ${{ steps.tag.outputs.tag }}

            ### 🚀 What's New
            <!-- Summarize the headline improvements for this release -->

            ### 🐛 Bug Fixes
            <!-- List bugs fixed in this release (reference BUG IDs/issues) -->

            ### ⚙️ Enhancements
            <!-- List new features and improvements -->

            ### 📱 Android APK
            Download `gardenify-${{ steps.tag.outputs.tag }}.apk` below and install on your Android device.

            **Installation:**
            1. Download the `gardenify-${{ steps.tag.outputs.tag }}.apk` file below
            2. Enable **Install from unknown sources** (Settings → Security)
            3. Open the downloaded APK to install

            ### 🌐 API
            - **Live API:** https://sasyakashi.vercel.app
            - **Swagger Docs:** https://sasyakashi.vercel.app/docs

            ### 📖 Documentation
            - **README:** https://github.com/luckyhegde6/gardenify
            - **Source Code:** https://github.com/luckyhegde6/gardenify

            ### 📋 What's Changed (PRs)
            <!-- Auto-generated PR list below -->
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    name: Deploy Backend to Production
    needs: create-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@58.4.4
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
