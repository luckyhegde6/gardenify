name: Build APK (Manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (development, preview, production)"
        required: true
        default: "preview"

permissions:
  contents: write

concurrency:
  group: build-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: production
    if: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK
        run: eas build -p android --profile ${{ inputs.profile }} --non-interactive --wait
      - name: Download APK
        run: eas build:download --platform android --output=gardenify.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gardenify-apk
          path: gardenify.apk
          retention-days: 14
