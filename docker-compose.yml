# Local Supabase stack — run `docker compose up -d`
# All secrets loaded from .env.local (see .env.local.example)
#
# Prerequisites:
#   1. cp .env.local.example .env.local
#   2. Edit .env.local with your keys
#   3. docker compose up -d
#
# Dashboard: http://localhost:54323
# API:       http://localhost:54321
# DB:        postgresql://postgres:${POSTGRES_PASSWORD}@localhost:54322/postgres

services:
  studio:
    image: supabase/studio:latest
    ports: ["54323:3000"]
    env_file: .env.local
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://localhost:54321
    depends_on:
      meta:
        condition: service_healthy

  meta:
    image: supabase/postgres-meta:latest
    ports: ["8080:8080"]
    env_file: .env.local
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: supabase/postgres:15.6.1
    ports: ["54322:5432"]
    env_file: .env.local
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  auth:
    image: supabase/gotrue:latest
    ports: ["9999:9999"]
    env_file: .env.local
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      db:
        condition: service_healthy

  rest:
    image: postgrest/postgrest:v12.2.3
    ports: ["3000:3000"]
    env_file: .env.local
    environment:
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
    depends_on:
      db:
        condition: service_healthy

  storage:
    image: supabase/storage-api:v1.11.13
    ports: ["5000:5000"]
    env_file: .env.local
    environment:
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - supabase_storage:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  supabase_data:
  supabase_storage:
